name: Integration workflow for Plotting library

on:
  pull_request:
    branches:
      - "main"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  Lint-Test-Build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checking out source code
        uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.ACTION_SETTINGS_APP_ID }}
          private-key: ${{ secrets.ACTION_SETTINGS_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Configure Git for private repo access
        run: |
          git config --global url."https://${{ secrets.READ_ALL_REPOS }}@github.com/".insteadOf "https://github.com/"

      - name: Resolving dependencies
        run: flutter pub get --no-offline

      - name: Linting
        run: flutter analyze .

      # - name: Running unit tests
      #  run: flutter test test/unit

      - name: Running widget tests
        run:  flutter test test/widget

      - name: Building web application
        run: flutter build web

  Acceptance-Tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        test: 
          - demo_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Chrome beta
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: beta
      
      - name: Installing chromedriver (needed for acceptance tests)
        uses: nanasess/setup-chromedriver@v2
        with:
          chromedriver-version: "140.0.7339.5"

      - name: Configure Git for private repo access
        run: |
          git config --global url."https://${{ secrets.FLUTTER_PLOTTING_SECRET }}@github.com/".insteadOf "https://github.com/"

      - name: Starting chromedriver and executing acceptance tests
        run: |
          chromedriver --port=4444 &
          flutter pub get
          flutter drive --chrome-binary=${{ steps.setup-chrome.outputs.chrome-path }} --driver=test/acceptance/driver/integration_test.dart --target=test/acceptance/${{ matrix.test }}.dart -d web-server --dart-define=USE_MOCK_SERVICES=true